<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free offline embroidery pricing calculator for small shops. Estimate stitch time, costs, margin and markup, then print a customer quote."><title>StitchQuote Lite — Embroidery Pricing</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#162338;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:28px 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{margin:0;font-size:30px}p{color:#596779}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:22px}.panel{background:white;border:1px solid #e0e6ef;border-radius:18px;padding:22px;box-shadow:0 6px 22px #1a31500a}h2{font-size:18px;margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:650;color:#37465a}input,select{padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;width:100%;background:white;color:#172338}button:disabled{opacity:.45;cursor:not-allowed}input:focus,select:focus{outline:2px solid #5a89dc}.wide{grid-column:1/-1}.result{font-size:34px;font-weight:800;color:#1458a3;margin:4px 0}.metric{padding:12px 0;border-bottom:1px solid #edf0f4;display:flex;justify-content:space-between;gap:8px}.metric:last-child{border:0}.sub{font-size:12px;color:#64748b}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}button{background:#175cd3;color:white;border:0;border-radius:9px;padding:11px 14px;font-weight:700;cursor:pointer}button.secondary{background:#eaf0f9;color:#254266}.note{font-size:12px;color:#657387;margin-top:16px;line-height:1.5}.quote{background:#f7faff;border:1px solid #dae5f6;border-radius:10px;padding:15px;margin-top:14px}.quote h3{margin:0 0 9px}.quote p{margin:5px 0}.error{color:#ae2938;font-size:13px;margin-top:10px;display:none}.lang{min-width:145px}.locale{display:flex;align-items:center;gap:8px}.locale label{white-space:nowrap}@media(max-width:720px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}h1{font-size:25px}}@media(max-width:440px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}}@media print{body{background:white}header,.inputs,.buttons,.note,.sub,.error,footer,.metric,.result{display:none!important}.grid{display:block}.panel{box-shadow:none;border:0;padding:0}.panel>h2{display:none}.quote{border:0;background:white;padding:0}.quote .sub{display:block!important}main{padding:0}}
</style></head><body><main>
<header class="head"><div><h1>🧵 StitchQuote Lite</h1><p data-i18n="subtitle"></p></div><div class="locale"><label for="language" data-i18n="language"></label><select id="language" class="lang"><option value="en">English</option><option value="tr">Türkçe</option></select></div></header>
<div class="grid"><section class="panel inputs"><h2 data-i18n="job"></h2><div class="fields">
<label class="wide"><span data-i18n="project"></span><input id="project" value="Custom Logo Order" maxlength="100"></label>
<label><span data-i18n="currency"></span><select id="currency"><option value="USD">USD ($)</option><option value="EUR">EUR (€)</option><option value="GBP">GBP (£)</option><option value="TRY">TRY (₺)</option></select></label>
<label><span data-i18n="qty"></span><input id="qty" type="number" min="1" step="1" value="24"></label>
<label><span data-i18n="blank"></span><input id="blank" type="number" min="0" step="0.01" value="5"></label>
<label><span data-i18n="materials"></span><input id="materials" type="number" min="0" step="0.01" value="0.8"></label>
<label><span data-i18n="stitches"></span><input id="stitches" type="number" min="0" step="100" value="8000"></label>
<label><span data-i18n="speed"></span><input id="speed" type="number" min="1" step="50" value="650"></label>
<label><span data-i18n="handling"></span><input id="handling" type="number" min="0" step="0.5" value="4"></label>
<label><span data-i18n="labor"></span><input id="labor" type="number" min="0" step="0.5" value="18"></label>
<label><span data-i18n="machine"></span><input id="machine" type="number" min="0" step="0.5" value="5"></label>
<label><span data-i18n="setup"></span><input id="setup" type="number" min="0" step="0.5" value="15"></label>
<label><span data-i18n="other"></span><input id="other" type="number" min="0" step="0.5" value="0"></label>
<label><span data-i18n="pricingMode"></span><select id="pricingMode"><option value="margin">Profit margin</option><option value="markup">Markup</option></select></label>
<label><span id="marginLabelInput" data-i18n="margin"></span><input id="margin" type="number" min="0" max="99.9" step="0.1" value="30"></label>
</div><div id="error" class="error" role="alert"></div><p class="note" data-i18n="timeNote"></p></section>
<section class="panel"><h2 data-i18n="suggested"></h2><div class="sub" data-i18n="unitLabel"></div><div class="result" id="unit">—</div>
<div class="metric"><span data-i18n="totalLabel"></span><strong id="total">—</strong></div>
<div class="metric"><span data-i18n="costLabel"></span><strong id="cost">—</strong></div>
<div class="metric"><span data-i18n="profitLabel"></span><strong id="profit">—</strong></div>
<div class="metric"><span data-i18n="marginLabel"></span><strong id="actualmargin">—</strong></div>
<div class="metric"><span data-i18n="hoursLabel"></span><strong id="hours">—</strong></div>
<div class="quote" id="quote"><h3 data-i18n="quoteTitle"></h3><p id="qproject"></p><p id="qdate"></p><p id="qdetails"></p><p id="qprice"></p><p class="sub" data-i18n="quoteNote"></p></div>
<div class="buttons"><button id="print" data-i18n="print"></button><button id="copy" class="secondary" data-i18n="copy"></button><button id="reset" class="secondary" data-i18n="reset"></button></div><p class="note" data-i18n="privacy"></p></section></div><footer class="note" data-i18n="footer"></footer></main>
<script>
'use strict';
const translations={
en:{subtitle:'Fast embroidery pricing & customer-ready quotes. No account required.',language:'Language',job:'Job details',project:'Customer / project name',currency:'Currency',qty:'Quantity (pieces)',blank:'Blank item cost (per piece)',materials:'Thread + backing (per piece)',stitches:'Stitches per piece',speed:'Machine speed (stitches/min)',handling:'Extra handling minutes (per piece)',labor:'Labor rate (per hour)',machine:'Machine overhead (per hour)',setup:'Setup / digitizing (per order)',other:'Other costs (per order)',margin:'Target profit margin (%)',markup:'Markup on cost (%)',pricingMode:'Pricing method',timeNote:'Machine time is estimated from stitches ÷ speed. Real production may take longer due to trims, thread changes and interruptions; adjust handling time and costs accordingly. Taxes and platform fees are not calculated separately; include any applicable costs in other costs. Per-item prices are rounded up to the nearest cent; actual margin may be slightly higher than the target.',suggested:'Suggested customer quote',unitLabel:'Suggested price per item',totalLabel:'Total quoted price',costLabel:'Total estimated cost',profitLabel:'Estimated gross profit',marginLabel:'Profit margin',hoursLabel:'Estimated production time',quoteTitle:'Customer quote',quoteNote:'Estimate only. Confirm final design, delivery, taxes and terms with the customer.',print:'Print / Save as PDF',copy:'Copy quote',copied:'Copied!',reset:'Reset example',privacy:'Private by design: calculations run locally in your browser. No details are sent to a server. Prices are estimates, not accounting or tax advice.',footer:'StitchQuote Lite • Free prototype • v0.5',invalid:'Enter valid non-negative values, a whole-number quantity of at least 1, a positive machine speed, and a valid pricing percentage (margin below 100%, markup up to 10,000%).',fallback:'Embroidery order',projectLine:'Project',dateLine:'Date',quantityLine:'Quantity',pieces:'pieces',priceLine:'Price per item',estimatedLine:'Estimated total',hoursUnit:'hr',quoteHeading:'Embroidery quote',terms:'Final terms, taxes and delivery to be confirmed.',copyFailed:'Copy failed. Select and copy the quote manually.'},
tr:{subtitle:'Nakış işleri için hızlı fiyat hesaplama ve müşteriye hazır teklifler. Üyelik gerekmez.',language:'Dil',job:'İş bilgileri',project:'Müşteri / proje adı',currency:'Para birimi',qty:'Adet',blank:'Boş ürün maliyeti (adet başına)',materials:'İplik + tela (adet başına)',stitches:'Adet başına dikiş sayısı',speed:'Makine hızı (dikiş/dakika)',handling:'Ek işlem süresi (dakika/adet)',labor:'İşçilik ücreti (saatlik)',machine:'Makine genel gideri (saatlik)',setup:'Hazırlık / desen hazırlama (sipariş başına)',other:'Diğer giderler (sipariş başına)',margin:'Hedef kâr marjı (%)',markup:'Maliyete eklenen kâr (%)',pricingMode:'Fiyatlandırma yöntemi',timeNote:'Makine süresi, dikiş sayısının hıza bölünmesiyle tahmin edilir. İplik kesimi, renk değişimi ve duruşlar gerçek süreyi artırabilir; ek süre ve maliyetleri buna göre ayarlayın. Vergiler ve platform komisyonları, diğer giderlere eklenmedikçe hesaba katılmaz. Birim fiyatlar yukarı yuvarlanır; gerçekleşen marj hedefin biraz üzerinde olabilir.',suggested:'Önerilen müşteri teklifi',unitLabel:'Önerilen birim satış fiyatı',totalLabel:'Toplam teklif tutarı',costLabel:'Tahmini toplam maliyet',profitLabel:'Tahmini brüt kâr',marginLabel:'Kâr marjı',hoursLabel:'Tahmini üretim süresi',quoteTitle:'Müşteri fiyat teklifi',quoteNote:'Bu bir tahmindir. Nihai tasarım, teslimat, vergiler ve koşulları müşteriyle doğrulayın.',print:'Yazdır / PDF kaydet',copy:'Teklifi kopyala',copied:'Kopyalandı!',reset:'Örnek değerleri sıfırla',privacy:'Gizlilik: Hesaplamalar tarayıcınızda yapılır. Bilgiler sunucuya gönderilmez. Fiyatlar tahminidir; muhasebe veya vergi danışmanlığı değildir.',footer:'StitchQuote Lite • Ücretsiz prototip • v0.5',invalid:'Geçerli, negatif olmayan değerler; en az 1 tam sayı adet; pozitif makine hızı ve geçerli bir oran girin (marj %100’ün altında, markup en fazla %10.000).',fallback:'Nakış siparişi',projectLine:'Proje',dateLine:'Tarih',quantityLine:'Adet',pieces:'adet',priceLine:'Birim fiyat',estimatedLine:'Tahmini toplam',hoursUnit:'sa',quoteHeading:'Nakış fiyat teklifi',terms:'Nihai koşullar, vergiler ve teslimat ayrıca onaylanmalıdır.',copyFailed:'Kopyalanamadı. Teklif metnini seçip elle kopyalayın.'}
};
const ids=['pricingMode','project','currency','qty','blank','materials','stitches','speed','handling','labor','machine','setup','other','margin'];
const $=id=>document.getElementById(id);
const defaults=Object.fromEntries(ids.map(id=>[id,$(id).value]));
let lang='en',quoteText='',valid=false;
function t(key){return translations[lang][key]}
function recalc(){
 const n=id=>Number($(id).value),q=n('qty'),m=n('margin'),speed=n('speed');
 const mode=$('pricingMode').value;const bad=ids.filter(id=>id!=='project'&&id!=='currency'&&id!=='pricingMode').some(id=>$(id).value.trim()===''||!Number.isFinite(n(id))||n(id)<0)||!Number.isInteger(q)||q<1||speed<=0||(mode==='margin'&&m>=100)||(mode==='markup'&&m>10000);
 valid=!bad;$('error').style.display=bad?'block':'none';$('error').textContent=bad?t('invalid'):'';
 $('copy').disabled=bad;$('print').disabled=bad;
 if(bad){quoteText='';['unit','total','cost','profit','actualmargin','hours'].forEach(id=>$(id).textContent='—');['qproject','qdate','qdetails','qprice'].forEach(id=>$(id).textContent='');return}
 const minutes=n('stitches')/speed+n('handling'),time=minutes*q/60;
 const totalCost=q*(n('blank')+n('materials'))+time*(n('labor')+n('machine'))+n('setup')+n('other');
 const rawTotal=mode==='margin'?totalCost/(1-m/100):totalCost*(1+m/100);
 // Round the unit quote UP to the smallest currency unit, then derive total from it.
 const digits=['JPY','KRW'].includes($('currency').value)?0:2;
 const scale=10**digits;const unit=Math.ceil((rawTotal/q)*scale-1e-5)/scale;
 const total=unit*q,profit=total-totalCost;
 if(![minutes,time,totalCost,rawTotal,unit,total,profit].every(Number.isFinite)||unit<0||total>1e12){valid=false;$('error').style.display='block';$('error').textContent=t('invalid');$('copy').disabled=true;$('print').disabled=true;quoteText='';['unit','total','cost','profit','actualmargin','hours'].forEach(id=>$(id).textContent='—');['qproject','qdate','qdetails','qprice'].forEach(id=>$(id).textContent='');return;}
 const actualMargin=total>0?profit/total*100:0;
 const locale=lang==='tr'?'tr-TR':'en-US';const cur=$('currency').value;
 const money=v=>new Intl.NumberFormat(locale,{style:'currency',currency:cur,minimumFractionDigits:digits,maximumFractionDigits:digits}).format(v);
 const date=new Date().toLocaleDateString(locale);
 $('unit').textContent=money(unit);$('total').textContent=money(total);$('cost').textContent=money(totalCost);$('profit').textContent=money(profit);$('actualmargin').textContent=new Intl.NumberFormat(locale,{maximumFractionDigits:1}).format(actualMargin)+'%';$('hours').textContent=new Intl.NumberFormat(locale,{maximumFractionDigits:2}).format(time)+' '+t('hoursUnit');
 const name=$('project').value.trim()||t('fallback');
 $('qproject').textContent=t('projectLine')+': '+name;$('qdate').textContent=t('dateLine')+': '+date;
 $('qdetails').textContent=t('quantityLine')+': '+q+' '+t('pieces')+' · '+t('priceLine')+': '+money(unit);
 $('qprice').textContent=t('estimatedLine')+': '+money(total);
 quoteText=[t('quoteHeading')+' — '+name,t('dateLine')+': '+date,t('quantityLine')+': '+q,t('priceLine')+': '+money(unit),t('estimatedLine')+': '+money(total),t('terms')].join('\n');
}
function updatePricingMode(){const mode=$('pricingMode').value;$('marginLabelInput').textContent=t(mode==='margin'?'margin':'markup');$('margin').max=mode==='margin'?'99.9':'10000';recalc()}
function applyLanguage(next){lang=next==='tr'?'tr':'en';document.documentElement.lang=lang;$('language').value=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));$('pricingMode').options[0].text=t('margin');$('pricingMode').options[1].text=t('markup');$('marginLabelInput').textContent=t($('pricingMode').value==='margin'?'margin':'markup');document.title='StitchQuote Lite — '+(lang==='tr'?'Nakış Fiyat Hesaplama':'Embroidery Pricing');recalc()}
ids.forEach(id=>$(id).addEventListener('input',id==='pricingMode'?updatePricingMode:recalc));
$('language').addEventListener('change',()=>applyLanguage($('language').value));
$('print').onclick=()=>{if(valid)window.print()};
$('copy').onclick=async()=>{if(!valid)return;let ok=false;try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(quoteText);ok=true}}catch(e){}if(!ok){try{const a=document.createElement('textarea');a.value=quoteText;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();ok=document.execCommand('copy');a.remove()}catch(e){}}if(ok){$('copy').textContent=t('copied');setTimeout(()=>$('copy').textContent=t('copy'),1400)}else alert(t('copyFailed'))};
$('reset').onclick=()=>{ids.forEach(id=>$(id).value=defaults[id]);updatePricingMode()};
applyLanguage('en');
</script></body></html>
